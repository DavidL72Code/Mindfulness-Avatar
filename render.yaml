services:
  - type: web
    name: multilingual-virtual-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt && python3 scripts/install_rhubarb.py
    startCommand: python3 server.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GOOGLE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ACCOUNT_DELETION_SECRET
        sync: false
      - key: ACCOUNT_DELETION_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ACCOUNT_DELETION_FROM_EMAIL
        sync: false
      - key: GEMINI_TTS_MODEL
        value: gemini-3.1-flash-tts-preview
      - key: GEMINI_TTS_VOICE
        value: Iapetus
